<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pfandjäger">
<meta name="theme-color" content="#0b1020">
<title>PFANDJÄGER 3D — U-Bahn Runner</title>
<style>
  :root { --amber:#ffb545; --ink:#e8ecf5; --muted:#8b96ad; --bg:#0b1020; }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; background:var(--bg); overflow:hidden; touch-action:none;
    font-family: ui-monospace,"SF Mono",Menlo,monospace; color:var(--ink);
    -webkit-user-select:none; user-select:none; }
  #stage { position:fixed; inset:0; }
  canvas { display:block; width:100%; height:100%; }
  .ov { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center;
    justify-content:center; text-align:center; z-index:10; padding:24px;
    background:radial-gradient(120% 90% at 50% 0%, rgba(20,27,46,.9), rgba(8,12,24,.95)); }
  .ov.hidden { display:none; }
  h1 { font-size:clamp(30px,8vw,60px); letter-spacing:.16em; color:var(--amber);
    text-shadow:0 0 28px rgba(255,181,69,.35); margin-bottom:6px; }
  .sub { color:var(--muted); font-size:clamp(12px,3vw,16px); margin-bottom:18px; }
  .hint { color:var(--muted); font-size:clamp(11px,3vw,14px); line-height:1.8; margin-bottom:22px; max-width:420px; }
  .hint b { color:var(--ink); }
  button { font-family:inherit; font-size:clamp(15px,4vw,19px); letter-spacing:.06em;
    color:#141018; background:var(--amber); border:none; border-radius:10px;
    padding:15px 44px; min-height:48px; cursor:pointer; }
  button:active { transform:scale(.96); }
  #hud { position:fixed; top:0; left:0; right:0; z-index:5; pointer-events:none;
    padding:14px 16px calc(14px + env(safe-area-inset-top));
    padding-top:calc(14px + env(safe-area-inset-top)); display:flex; justify-content:space-between; align-items:flex-start; }
  #score { font-size:clamp(20px,5vw,30px); font-weight:bold; text-shadow:0 2px 8px rgba(0,0,0,.6); }
  #score .eur { color:var(--amber); }
  #combo { font-size:clamp(12px,3vw,15px); color:var(--amber); margin-top:2px; min-height:18px; }
  #right { text-align:right; font-size:clamp(14px,3.5vw,18px); color:#ff5d5d; text-shadow:0 2px 8px rgba(0,0,0,.6); }
  #fps { position:fixed; bottom:calc(6px + env(safe-area-inset-bottom)); right:8px; font-size:10px; color:var(--muted); z-index:5; opacity:.7; }
  .chrome { position:fixed; top:calc(10px + env(safe-area-inset-top)); right:12px; z-index:8; display:flex; gap:8px; }
  .chrome button { min-height:36px; padding:6px 14px; font-size:12px; background:transparent; color:var(--ink); border:1px solid #2e3a52; border-radius:8px; }
  #pauseBtn { pointer-events:auto; }
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas></div>

<div id="hud" class="hidden">
  <div>
    <div id="score"><span class="eur">0,00 €</span></div>
    <div id="combo"></div>
  </div>
  <div id="right">♥</div>
</div>

<div class="chrome hidden" id="chrome">
  <button id="langBtn">DE</button>
  <button id="muteBtn">♪</button>
  <button id="pauseBtn">II</button>
</div>
<div id="fps"></div>

<div class="ov" id="menu">
  <h1>PFANDJÄGER</h1>
  <div class="sub" id="menuSub">U-Bahn Runner. Sammle Pfand. Weiche den Zügen aus.</div>
  <div class="hint" id="menuHint"></div>
  <button id="startBtn">LOS GEHT'S</button>
</div>

<div class="ov hidden" id="over">
  <h1>ABGERÄUMT</h1>
  <div class="sub" id="overStats"></div>
  <button id="againBtn">NOCHMAL</button>
</div>

<script src="src/three.min.js"></script>
<script src="src/GLTFLoader.js"></script>
<script src="src/game.js"></script>
</body>
</html>
